[project]
name = "skylight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "eccodes>=2.48.0",
    "eccodeslib>=2.49.0.30",
    "fastapi>=0.141.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.uv.workspace]
members = [
    "rate_limiter",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
